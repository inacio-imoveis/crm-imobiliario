<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM — Ricardo Inácio Imóveis</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:#f4f6f8;color:#1a1a1a}
.hidden{display:none!important}
#login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0F6E56}
.login-box{background:#fff;border-radius:12px;padding:32px;width:100%;max-width:360px}
.login-box h1{font-size:20px;font-weight:600;margin-bottom:4px;color:#0F6E56}
.login-box p{font-size:13px;color:#666;margin-bottom:24px}
.form-group{margin-bottom:16px}
.form-group label{font-size:12px;color:#666;display:block;margin-bottom:6px}
.form-group input{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px}
.btn-primary{width:100%;padding:11px;background:#0F6E56;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer}
.btn-primary:hover{background:#085041}
nav{background:#0F6E56;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.nav-logo{color:#fff;font-weight:600;font-size:15px}
.nav-tabs{display:flex;gap:4px}
.nav-tab{padding:7px 14px;border:none;background:transparent;color:rgba(255,255,255,0.7);border-radius:6px;cursor:pointer;font-size:13px}
.nav-tab.active,.nav-tab:hover{background:rgba(255,255,255,0.15);color:#fff}
.nav-user{color:rgba(255,255,255,0.8);font-size:13px;cursor:pointer}
main{padding:20px;max-width:1100px;margin:0 auto}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.metric{background:#fff;border-radius:10px;padding:16px;border:1px solid #e8e8e8}
.metric-label{font-size:12px;color:#888;margin-bottom:4px}
.metric-value{font-size:26px;font-weight:600;color:#0F6E56}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.toolbar h2{font-size:16px;font-weight:600}
.btn-green{padding:8px 16px;background:#0F6E56;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer}
.btn-green:hover{background:#085041}
.lead-card{background:#fff;border-radius:10px;padding:14px 16px;margin-bottom:10px;border:1px solid #e8e8e8;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.avatar{width:38px;height:38px;border-radius:50%;background:#E1F5EE;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#0F6E56;flex-shrink:0}
.lead-info{flex:1;min-width:120px}
.lead-name{font-size:14px;font-weight:500}
.lead-sub{font-size:12px;color:#888;margin-top:2px}
.badge{font-size:11px;padding:3px 9px;border-radius:12px;font-weight:500}
.badge-novo{background:#E1F5EE;color:#0F6E56}
.badge-contato{background:#dbeafe;color:#1d4ed8}
.badge-visita{background:#fef3c7;color:#92400e}
.badg
